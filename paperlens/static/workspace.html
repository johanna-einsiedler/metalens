<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Metalens — workspace</title>
  <link rel="stylesheet" href="/static/theme.css"/>
  <link rel="stylesheet" href="/static/base.css"/>
  <link rel="stylesheet" href="/static/grammar.css"/>
  <link rel="stylesheet" href="/static/grid.css"/>
</head>
<body>
  <header class="topbar" data-chrome></header>
  <main class="split">
    <nav id="doctabs" class="docsidebar"></nav>
    <aside id="panel" class="panel"><div id="panelbody"></div></aside>
    <div id="splitter" class="splitter" title="drag to resize"></div>
    <section id="pagespane" class="pagespane">
      <div id="evpane" class="stg-evpane"></div>
      <div id="hsplitter" class="hsplitter" title="drag to resize"></div>
      <div id="pdfpane" class="pdfpane">
        <div id="pdfzoom" class="pdfzoom">
          <span class="pdfsearch" id="pdfsearchbox">
            <input id="pdfsearch" type="search" placeholder="find in PDF" title="find words in the PDF — Enter: next hit, Shift+Enter: previous, Esc: clear (/ focuses this box)" autocomplete="off" spellcheck="false"/>
            <span id="pdfsearchn" class="pdfsearch-n" hidden></span>
            <button type="button" data-s="prev" title="previous hit (Shift+Enter)" hidden>↑</button>
            <button type="button" data-s="next" title="next hit (Enter)" hidden>↓</button>
            <button type="button" id="pdfkeep" class="pdf-mark" title="keep this hit as one of your marks (kept with the paper; a flag can point at it)" hidden>✎ keep</button>
          </span>
          <button type="button" id="pdfmark" class="pdf-mark" title="mark: click a sentence in the PDF, or drag over the words you want, to keep it with the paper (h)">✎ mark</button>
          <span class="pdfzoom-z" title="zoom the pages (also Ctrl/⌘ + mouse wheel over the PDF)">
            <button type="button" data-z="out" title="zoom out">−</button><span id="pdfzoomval">fit</span>
            <button type="button" data-z="in" title="zoom in">+</button><button type="button" data-z="fit" title="fit the pane width">fit</button>
          </span>
        </div>
        <div id="pages" class="pages"><p class="muted">Select a document.</p></div>
      </div>
    </section>
  </main>
  <script type="module" src="/static/workspace.js"></script>
  <script type="module">import { mountChrome } from "/static/chrome.js"; mountChrome();</script>
</body>
</html>
