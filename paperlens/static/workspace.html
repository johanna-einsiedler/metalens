<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Metalens — workspace</title>
  <link rel="stylesheet" href="/static/theme.css"/>
  <link rel="stylesheet" href="/static/base.css"/>
  <link rel="stylesheet" href="/static/grammar.css"/>
  <link rel="stylesheet" href="/static/grid.css"/>
</head>
<body>
  <header class="topbar" data-chrome></header>
  <main class="split">
    <nav id="doctabs" class="docsidebar"></nav>
    <aside id="panel" class="panel"><div id="panelbody"></div></aside>
    <div id="splitter" class="splitter" title="drag to resize"></div>
    <section id="pagespane" class="pagespane">
      <div id="pdfzoom" class="pdfzoom" title="zoom the pages (also Ctrl/⌘ + mouse wheel over the PDF)">
        <button type="button" data-z="out" title="zoom out">−</button><span id="pdfzoomval">fit</span>
        <button type="button" data-z="in" title="zoom in">+</button><button type="button" data-z="fit" title="fit the pane width">fit</button>
      </div>
      <div id="pages" class="pages"><p class="muted">Select a document.</p></div>
    </section>
  </main>
  <script type="module" src="/static/workspace.js"></script>
  <script type="module">import { mountChrome } from "/static/chrome.js"; mountChrome();</script>
</body>
</html>
