[project]
name = "maseminer"
version = "2.0.0"
description = "Metalens / MASEMiner — AI-assisted data extraction from research papers with human review; runs hosted or on one machine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Johanna Einsiedler" }]
keywords = ["meta-analysis", "MASEM", "data extraction", "systematic review", "LLM"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "arq>=0.26",
    "boto3>=1.34",
    "pymupdf>=1.24",
    "openai>=1.30",
    "google-genai>=1.0",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
    "pgserver>=0.1.4",
]

[project.scripts]
maseminer = "paperlens.local:main"

[project.urls]
Homepage = "https://github.com/johanna-einsiedler/metalens"
Source = "https://github.com/johanna-einsiedler/metalens"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paperlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
