name: Mirror to the maseminer repo

# The engine lives in THIS repo. The public `maseminer` repository is the MASEMiner
# distribution, kept for people who bookmarked or cited it: on every release tag (and on
# demand) the tagged tree — with the presets of other brands removed by scripts/masem_only.py —
# is pushed there as `main` plus the tag, so the two never drift. Needs one secret,
# MASEMINER_PUSH_TOKEN: a fine-grained GitHub token with "Contents: read and write" on the
# mirror repo (Settings → Developer settings → Fine-grained tokens), stored with
#   gh secret set MASEMINER_PUSH_TOKEN
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: push the tree to the mirror
        env:
          TOKEN: ${{ secrets.MASEMINER_PUSH_TOKEN }}
          MIRROR: github.com/${{ github.repository_owner }}/maseminer.git
        run: |
          [ -n "$TOKEN" ] || { echo "MASEMINER_PUSH_TOKEN is not set"; exit 1; }
          git remote add mirror "https://x-access-token:${TOKEN}@${MIRROR}"
          # the MASEMiner distribution of this commit (the tagged one, or the branch head for
          # a manual run): the other brands' presets removed, as one commit on top
          python3 scripts/masem_only.py
          git -c user.name="metalens release" -c user.email="noreply@metalens.tech" add -A
          git -c user.name="metalens release" -c user.email="noreply@metalens.tech" \
            commit -q -m "MASEMiner distribution of ${GITHUB_SHA::7}${GITHUB_REF_TYPE:+ (${GITHUB_REF_NAME})}"
          git push --force mirror "HEAD:refs/heads/main"
          # a release tag points at the distribution commit, not at the engine's
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then git push --force mirror "HEAD:refs/tags/${GITHUB_REF_NAME}"; fi
