# MASEMiner in Docker — the single-user local mode with a Postgres container instead of the
# embedded server. `docker compose up`, then open http://127.0.0.1:8765. Data persists in the
# two named volumes; `docker compose down -v` deletes it.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: maseminer
      POSTGRES_PASSWORD: maseminer
      POSTGRES_DB: maseminer
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maseminer"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      MASEMINER_DATABASE_URL: postgresql://maseminer:maseminer@db:5432/maseminer
      MASEMINER_HOME: /data
    command: ["maseminer", "--host", "0.0.0.0", "--port", "8765", "--no-browser", "--data-dir", "/data"]
    ports: ["8765:8765"]
    volumes: ["mmdata:/data"]

volumes:
  pgdata: {}
  mmdata: {}
